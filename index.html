<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Cruise Ship Simulator Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #1a1a2e;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
            font-style: italic;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .mode-btn {
            padding: 12px 25px;
            border: 2px solid #e74c3c;
            background: white;
            color: #e74c3c;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: #e74c3c;
            color: white;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
        }

        .question-container {
            margin-bottom: 30px;
        }

        .question-number {
            color: #e74c3c;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .question-text {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option:hover {
            border-color: #e74c3c;
            background: #fff5f3;
        }

        .option input[type="radio"] {
            margin-right: 12px;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .option.correct {
            background: #e8f5e9;
            border-color: #4caf50;
        }

        .option.incorrect {
            background: #ffebee;
            border-color: #f44336;
        }

        .feedback {
            margin-top: 15px;
            padding: 12px 15px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            font-weight: 500;
        }

        .feedback.correct {
            background: #c8e6c9;
            color: #2e7d32;
            display: block;
        }

        .feedback.incorrect {
            background: #ffcdd2;
            color: #c62828;
            display: block;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background: #e74c3c;
            color: white;
        }

        .btn-submit:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .answer-key {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
            display: none;
        }

        .answer-key.show {
            display: block;
        }

        .answer-key h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .answer-item {
            background: white;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-left: 4px solid #e74c3c;
            border-radius: 4px;
        }

        .answer-item strong {
            color: #e74c3c;
        }

        .score-display {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-top: 30px;
            display: none;
        }

        .score-display.show {
            display: block;
        }

        .score-number {
            font-size: 48px;
            font-weight: 700;
            margin: 15px 0;
        }

        .score-text {
            font-size: 18px;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚢 Roblox Cruise Ship Simulator</h1>
        <p class="subtitle">Is Tableboard Studios the Developer? 2026 Project Quiz</p>

        <div class="mode-selector">
            <button class="mode-btn active" onclick="switchMode('quiz')">Quiz Mode</button>
            <button class="mode-btn" onclick="switchMode('answerkey')">Answer Key</button>
        </div>

        <div id="quiz-mode">
            <form id="quizForm">
                <div id="questionsContainer"></div>
                <div class="button-group">
                    <button type="button" class="btn-submit" onclick="submitQuiz()">Submit Quiz</button>
                    <button type="reset" class="btn-reset" onclick="resetQuiz()">Clear Answers</button>
                </div>
            </form>
            <div id="scoreDisplay" class="score-display">
                <div class="score-text">Your Score</div>
                <div class="score-number"><span id="scoreValue">0</span>/<span id="totalQuestions">0</span></div>
                <div id="scorePercentage"></div>
            </div>
        </div>

        <div id="answerkey-mode" style="display: none;">
            <div id="answerKeyDisplay" class="answer-key"></div>
        </div>
    </div>

    <script>
        // Quiz Data
        const quizData = [
            {
                question: "Is Tableboard Studios the developer of Roblox Cruise Ship Simulator?",
                options: ["Yes", "No", "Uncertain", "Not applicable"],
                correct: 0
            },
            {
                question: "What type of game is Roblox Cruise Ship Simulator?",
                options: ["Simulation/Tycoon", "FPS Shooter", "Racing Game", "Role-Playing Game"],
                correct: 0
            },
            {
                question: "Is there a 2026 project update planned for Cruise Ship Simulator?",
                options: ["Yes", "No", "Unknown", "Cancelled"],
                correct: 2
            },
            {
                question: "What platform is Cruise Ship Simulator built on?",
                options: ["Unity", "Unreal Engine", "Roblox", "Custom Engine"],
                correct: 2
            },
            {
                question: "Does Tableboard Studios focus on creating simulation games on Roblox?",
                options: ["Yes, primarily", "No, they focus on other genres", "Uncertain", "They don't create games"],
                correct: 0
            },
            {
                question: "In what year was the Cruise Ship Simulator game released?",
                options: ["2022", "2023", "2024", "2025"],
                correct: 1
            },
            {
                question: "What is the main objective in Cruise Ship Simulator?",
                options: ["Build and manage a cruise ship empire", "Battle other players", "Collect treasure", "Complete racing courses"],
                correct: 0
            },
            {
                question: "Is Tableboard Studios planning updates for their games in 2026?",
                options: ["Yes, new features planned", "No updates planned", "Unknown/Unconfirmed", "Studio dissolved"],
                correct: 2
            }
        ];

        let currentMode = 'quiz';
        let userAnswers = new Array(quizData.length).fill(null);

        function initializeQuiz() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            quizData.forEach((item, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question-container';
                questionDiv.innerHTML = `
                    <div class="question-number">Question ${index + 1} of ${quizData.length}</div>
                    <div class="question-text">${item.question}</div>
                    <div class="options">
                        ${item.options.map((option, optIndex) => `
                            <label class="option">
                                <input type="radio" name="question${index}" value="${optIndex}" 
                                    ${userAnswers[index] === optIndex ? 'checked' : ''}
                                    onchange="userAnswers[${index}] = ${optIndex}">
                                <span>${option}</span>
                            </label>
                        `).join('')}
                    </div>
                    <div id="feedback${index}" class="feedback"></div>
                `;
                container.appendChild(questionDiv);
            });

            document.getElementById('totalQuestions').textContent = quizData.length;
        }

        function submitQuiz() {
            let score = 0;
            quizData.forEach((item, index) => {
                const feedback = document.getElementById(`feedback${index}`);
                const options = document.querySelectorAll(`input[name="question${index}"]`);
                const selectedOption = Array.from(options).findIndex(opt => opt.checked);

                options.forEach((opt, optIndex) => {
                    const optionLabel = opt.parentElement;
                    optionLabel.classList.remove('correct', 'incorrect');

                    if (optIndex === item.correct) {
                        optionLabel.classList.add('correct');
                    }
                    if (selectedOption === optIndex && selectedOption !== item.correct) {
                        optionLabel.classList.add('incorrect');
                    }
                });

                if (selectedOption === item.correct) {
                    score++;
                    feedback.textContent = '✓ Correct!';
                    feedback.className = 'feedback correct';
                } else if (selectedOption !== -1) {
                    feedback.textContent = `✗ Incorrect. The correct answer is: ${item.options[item.correct]}`;
                    feedback.className = 'feedback incorrect';
                } else {
                    feedback.textContent = '⚠ Please select an answer.';
                    feedback.className = 'feedback incorrect';
                }
            });

            const scoreDisplay = document.getElementById('scoreDisplay');
            const percentage = Math.round((score / quizData.length) * 100);
            document.getElementById('scoreValue').textContent = score;
            document.getElementById('scorePercentage').textContent = `${percentage}% Correct`;
            scoreDisplay.classList.add('show');

            // Scroll to score
            setTimeout(() => scoreDisplay.scrollIntoView({ behavior: 'smooth' }), 100);
        }

        function resetQuiz() {
            userAnswers = new Array(quizData.length).fill(null);
            document.getElementById('quizForm').reset();
            document.getElementById('scoreDisplay').classList.remove('show');
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('correct', 'incorrect');
            });
            document.querySelectorAll('.feedback').forEach(fb => {
                fb.className = 'feedback';
                fb.textContent = '';
            });
        }

        function switchMode(mode) {
            currentMode = mode;
            const quizMode = document.getElementById('quiz-mode');
            const answerkeyMode = document.getElementById('answerkey-mode');
            const buttons = document.querySelectorAll('.mode-btn');

            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (mode === 'quiz') {
                quizMode.style.display = 'block';
                answerkeyMode.style.display = 'none';
            } else {
                quizMode.style.display = 'none';
                answerkeyMode.style.display = 'block';
                displayAnswerKey();
            }
        }

        function displayAnswerKey() {
            const container = document.getElementById('answerKeyDisplay');
            container.innerHTML = '<h3>Answer Key - Roblox Cruise Ship Simulator Quiz</h3>';

            quizData.forEach((item, index) => {
                const answerItem = document.createElement('div');
                answerItem.className = 'answer-item';
                answerItem.innerHTML = `
                    <div><strong>Question ${index + 1}:</strong> ${item.question}</div>
                    <div style="margin-top: 8px; color: #e74c3c; font-weight: 600;">
                        ✓ Correct Answer: ${item.options[item.correct]}
                    </div>
                `;
                container.appendChild(answerItem);
            });
        }

        // Initialize on page load
        window.addEventListener('load', initializeQuiz);
    </script>
</body>
</html>
