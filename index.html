<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muster Drill Pro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Muster Drill Attendance</h1>

    <div id="alertBanner" class="alert-banner hidden">
      🚨 EMERGENCY MUSTER DRILL ACTIVE — REPORT TO ASSEMBLY POINT 🚨
    </div>

    <div class="top-section">
      <div class="drill-box">
        <h2>Drill Control</h2>
        <p id="drillStatus" class="status inactive">Not Started</p>
        <p><strong>Timer:</strong> <span id="timer">00:00</span></p>

        <div class="buttons">
          <button id="startBtn">Start Drill</button>
          <button id="stopBtn" disabled>Stop Drill</button>
          <button id="resetBtn">Reset</button>
          <button id="muteBtn">Mute</button>
        </div>

        <div class="volume-box">
          <label for="volumeSlider"><strong>Volume:</strong></label>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.7" />
          <span id="volumeValue">70%</span>
        </div>
      </div>

      <div class="summary-box">
        <h2>Summary</h2>
        <p>Total Personnel: <span id="totalCount">0</span></p>
        <p>Present: <span id="presentCount">0</span></p>
        <p>Missing: <span id="missingCount">0</span></p>
      </div>
    </div>

    <div class="add-person">
      <h2>Add Personnel</h2>
      <div class="add-row">
        <input type="text" id="personName" placeholder="Enter name" />
        <button id="addPersonBtn">Add</button>
      </div>
    </div>

    <div class="list-section">
      <h2>Personnel List</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="personList"></tbody>
      </table>
    </div>
  </div>

  <audio id="sirenSound" src="siren.mp3" preload="auto" loop></audio>

  <script src="script.js"></script>
</body>
</html>
