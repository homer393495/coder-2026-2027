<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muster Drill</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Muster Drill Attendance</h1>

    <div class="top-section">
      <div class="drill-box">
        <h2>Drill Status</h2>
        <p id="drillStatus" class="status inactive">Not Started</p>
        <p><strong>Timer:</strong> <span id="timer">00:00</span></p>
        <div class="buttons">
          <button id="startBtn">Start Drill</button>
          <button id="stopBtn" disabled>Stop Drill</button>
          <button id="resetBtn">Reset</button>
        </div>
      </div>

      <div class="summary-box">
        <h2>Summary</h2>
        <p>Total Personnel: <span id="totalCount">0</span></p>
        <p>Present: <span id="presentCount">0</span></p>
        <p>Missing: <span id="missingCount">0</span></p>
      </div>
    </div>

    <div class="add-person">
      <h2>Add Personnel</h2>
      <input type="text" id="personName" placeholder="Enter name" />
      <button id="addPersonBtn">Add</button>
    </div>

    <div class="list-section">
      <h2>Personnel List</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="personList"></tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
